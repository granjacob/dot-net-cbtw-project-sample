name: serviceflow

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: serviceflow-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-ServiceFlow_2026!Local}"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - serviceflow

  kafka:
    image: apache/kafka:4.1.1
    container_name: serviceflow-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - serviceflow

  kafka-init:
    image: apache/kafka:4.1.1
    container_name: serviceflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic serviceflow.request-events --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic serviceflow.request-events.dlq --partitions 1 --replication-factor 1
    networks:
      - serviceflow

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: serviceflow-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: serviceflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - serviceflow

  request-service:
    build:
      context: ./backend/request-service
      dockerfile: Dockerfile
    container_name: serviceflow-requests
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RequestsDatabase: "Server=sqlserver,1433;Database=ServiceFlowRequests;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ServiceFlow_2026!Local};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Issuer: ServiceFlow
      Jwt__Audience: ServiceFlow.Client
      Jwt__Key: "${JWT_KEY:-serviceflow-local-jwt-signing-key-2026-change-me-please}"
      Kafka__BootstrapServers: kafka:9092
      Kafka__Topic: serviceflow.request-events
      Kafka__ClientId: serviceflow-request-outbox
      RequestId__NodeId: 0
    ports:
      - "${REQUEST_SERVICE_PORT:-5001}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - serviceflow

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: serviceflow-notifications
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__NotificationsDatabase: "Server=sqlserver,1433;Database=ServiceFlowNotifications;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ServiceFlow_2026!Local};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Issuer: ServiceFlow
      Jwt__Audience: ServiceFlow.Client
      Jwt__Key: "${JWT_KEY:-serviceflow-local-jwt-signing-key-2026-change-me-please}"
      Kafka__BootstrapServers: kafka:9092
      Kafka__Topic: serviceflow.request-events
      Kafka__DeadLetterTopic: serviceflow.request-events.dlq
      Kafka__GroupId: serviceflow-notifications
      Kafka__ClientId: serviceflow-notification-consumer
      SignalR__BroadcastToAll: "false"
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-5002}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - serviceflow

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: serviceflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - request-service
      - notification-service
    networks:
      - serviceflow

volumes:
  sqlserver_data:
    name: serviceflow-sqlserver-data
  kafka_data:
    name: serviceflow-kafka-data

networks:
  serviceflow:
    name: serviceflow-network
    driver: bridge
